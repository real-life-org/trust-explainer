name: pages
# The overview (slides with presentation mode, video player, animations)
# and the embed pages, built with Vite to out/web. Pull requests build it;
# main deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Least privilege: the build (which also runs for pull requests) only reads;
# only the deploy job may publish to Pages.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # Only main is ever published: pull requests carry refs/pull/…, and a
      # manual run on another branch builds but never uploads or deploys.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: out/web }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
